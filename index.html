<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kotoba Mate｜日文單字複習工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2a4a;--ink2:#4a5675;--paper:#e9edf3;--card:#fff;--line:#c9d1df;--accent:#2f4b8f;--red:#b83a30;--ok:#2d7a57;
--serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif TC",serif;--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-family:var(--serif);font-size:28px;margin:0;line-height:1.2}
h1 small{display:block;font-family:var(--sans);font-size:14px;font-weight:400;color:var(--ink2)}
.count{text-align:right}
.count b{font-family:var(--serif);font-size:44px;line-height:1;color:var(--accent)}
.count span{font-size:13px;color:var(--ink2);display:block}
.count input{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:#fff;color:var(--ink)}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stats div{flex:1;background:var(--card);border-radius:10px;padding:8px 14px;border:1px solid var(--line);font-size:14px;color:var(--ink2)}
.stats b{font-size:20px;color:var(--ink);margin-left:6px}
.seg{display:flex;border:1px solid var(--accent);border-radius:10px;overflow:hidden;margin-bottom:14px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:80px;border:0;background:#fff;color:var(--accent);padding:9px 4px;font:inherit;font-size:14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--accent)}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px 20px 24px;text-align:center;position:relative;min-height:220px}
.tag{position:absolute;top:12px;left:16px;font-size:13px;color:var(--ink2)}
.q{font-family:var(--serif);font-size:clamp(26px,7vw,42px);font-weight:700;word-break:break-all;margin:12px 0 6px;line-height:1.3}
.ans{margin-top:16px;padding-top:14px;border-top:2px dashed var(--line);animation:in .2s ease}
@keyframes in{from{opacity:0}to{opacity:1}}
.ans .a1{font-family:var(--serif);font-size:26px;font-weight:700}
.ans .a2{font-size:18px;color:var(--ink2);margin-top:2px}
.history-box{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--ink2);text-align:left}
.history-title{font-weight:500;margin-bottom:6px;display:flex;justify-content:space-between}
.history-tags{display:flex;gap:6px;flex-wrap:wrap}
.htag{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.htag.no{background:#fce8e6;color:var(--red)}
.htag.mid{background:#e8ecf4;color:var(--ink2)}
.htag.yes{background:#e6f4ea;color:var(--ok)}
.hint{color:var(--ink2);font-size:14px;margin-top:20px}
button{font-family:inherit}
.btn{border:0;border-radius:10px;padding:12px 20px;font-size:16px;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.seg button:focus-visible,summary:focus-visible{outline:3px solid #f0b429;outline-offset:2px}
.row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.rate .btn{flex:1;min-width:100px}
.rate .no{background:var(--red)}.rate .mid{background:#6b7694}.rate .yes{background:var(--ok)}
.rate small{display:block;font-size:12px;opacity:.85}
.dots{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:14px;padding:0 16px}
summary{cursor:pointer;padding:12px 0;font-weight:500}
details[open] summary{border-bottom:1px solid var(--line);margin-bottom:12px}
details>div{padding-bottom:16px}
label{display:block;font-size:14px;margin-top:8px;color:var(--ink2)}
input[type=text]{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-top:2px}
.msg{margin-top:10px;font-size:14px;white-space:pre-line}.msg.err{color:var(--red)}.msg.ok{color:var(--ok)}
.empty{padding:20px 0}
.empty p{margin:0 0 14px;color:var(--ink2)}
.small{font-size:13px;color:var(--ink2)}
@media(prefers-reduced-motion:reduce){.ans{animation:none}}
</style>
</head>
<body>
<main>
<header>
  <h1>Kotoba Mate<small>日文單字複習工具</small></h1>
  <div class="count">
    <b id="days">–</b><span id="daysLabel">天後考試</span>
    <label style="margin:2px 0 0;display:inline-block">考試日期 <input type="date" id="examDate"></label>
  </div>
</header>

<section class="stats" aria-label="學習統計">
  <div>單字總數<b id="total">0</b></div>
  <div>平均熟悉度<b id="avg">0.0</b><span class="small">/ 5</span></div>
</section>

<div class="seg" role="group" aria-label="出題模式" id="modes">
  <button data-m="mix" aria-pressed="true">隨機混合</button>
  <button data-m="kanji" aria-pressed="false">只抽漢字</button>
  <button data-m="kana" aria-pressed="false">只抽平假名</button>
  <button data-m="recent1" aria-pressed="false">近 1 天新增</button>
</div>

<section class="card" id="card" aria-live="polite"></section>
<div id="actions"></div>

<details id="addBox">
  <summary>新增單字</summary>
  <div>
    <label>漢字（沒有可留空）<input type="text" id="fKanji" autocomplete="off"></label>
    <label>平假名（必填）<input type="text" id="fKana" autocomplete="off"></label>
    <label>中文意思（必填）<input type="text" id="fMeaning" autocomplete="off"></label>
    <div class="row" style="justify-content:flex-start"><button class="btn" id="addBtn">加入單字庫</button></div>
    <p class="small">熟悉度會從 0 開始，day 由系統依考試日期自動記錄。</p>
    <div class="msg" id="addMsg"></div>
  </div>
</details>

<details id="csvBox">
  <summary>CSV 匯入與匯出</summary>
  <div>
    <p class="small">欄位：漢字、ひらがな（或 平假名）、意味（或 中文意思）、熟悉度、day。匯入時只會加入新單字，已存在的單字不會被覆蓋。</p>
    <div class="row" style="justify-content:flex-start">
      <button class="btn" id="exportBtn">匯出 CSV</button>
      <button class="btn ghost" id="importBtn">選擇 CSV 匯入</button>
      <input type="file" id="file" accept=".csv,text/csv" hidden>
    </div>
    <div class="msg" id="csvMsg"></div>
  </div>
</details>
<p class="small" style="margin-top:16px">資料儲存在這個瀏覽器的 localStorage，換裝置或網址不會同步，請定期匯出 CSV 備份。</p>
</main>

<script>
(function(){
const WK='kotobaMate.words', EK='kotobaMate.exam';
const BASE=[100,80,60,40,20,5];
const SAMPLE=[
 ['締切','しめきり','截止日期'],['都合','つごう','方便、情況'],['延期','えんき','延期'],
 ['','たぶん','大概'],['迷う','まよう','迷惑、猶豫'],['届ける','とどける','送達']
];
const $=id=>document.getElementById(id);
let words=[], examStr='2026-12-06', mode='mix';
let cur=null, qType='kana', shown=false, rated=false;

/* ---------- storage ---------- */
function load(){
  try{
    const w=JSON.parse(localStorage.getItem(WK)||'[]'); 
    if(Array.isArray(w)) words=w.filter(x=>x&&x.kana&&x.meaning);
  }catch(e){words=[];}
  try{examStr=localStorage.getItem(EK)||examStr;}catch(e){}
}
function save(){try{localStorage.setItem(WK,JSON.stringify(words));}catch(e){}}

/* ---------- exam countdown ---------- */
function toLocal(s){const p=(s||'').split('-').map(Number);return p.length===3&&p[0]?new Date(p[0],p[1]-1,p[2]):null;}
function daysLeft(){
  const e=toLocal(examStr); if(!e) return {n:0,over:false,none:true};
  const t=new Date(); t.setHours(0,0,0,0);
  const d=Math.round((e-t)/864e5);
  return {n:Math.max(0,d),over:d<0,none:false};
}
function renderCount(){
  const d=daysLeft();
  $('examDate').value=examStr;
  $('days').textContent=d.none?'–':d.n;
  $('daysLabel').textContent=d.over?'考試已結束':(d.n===0?'今天考試':'天後考試');
}

/* ---------- stats ---------- */
function renderStats(){
  $('total').textContent=words.length;
  $('avg').textContent=words.length?(words.reduce((s,w)=>s+w.level,0)/words.length).toFixed(1):'0.0';
}

/* ---------- pool filter & weighted draw ---------- */
function filterWordsByMode(){
  if(!words.length) return [];
  if(mode === 'recent1'){
    const currentDay = daysLeft().n;
    // 篩選距離當前 day 在 1 天以內的單字（即 w.day 為 currentDay 或 currentDay - 1）
    return words.filter(w => typeof w.day === 'number' && w.day >= currentDay - 1 && w.day <= currentDay);
  }
  return words;
}

function weight(w){return BASE[w.level]+14/(1+Math.max(0,w.day)/30);}
function draw(prev){
  let pool = filterWordsByMode();
  if(!pool.length && mode === 'recent1'){
    alert('近 1 天沒有新增的單字，將自動切換回隨機混合模式。');
    mode = 'mix';
    document.querySelectorAll('#modes button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.m===mode));
    pool = words;
  }
  if(!pool.length) return null;
  let candidates = pool.length > 1 ? pool.filter(w => w !== prev) : pool;
  const ws = candidates.map(weight); 
  let r = Math.random() * ws.reduce((a,b)=>a+b, 0);
  for(let i=0; i<candidates.length; i++){
    r -= ws[i]; 
    if(r <= 0) return candidates[i];
  }
  return candidates[candidates.length-1];
}

function pickType(w){
  if(mode==='kanji') return w.kanji?'kanji':'kana';
  if(mode==='kana') return 'kana';
  return (w.kanji&&Math.random()<.5)?'kanji':'kana';
}
function next(){
  cur=words.length?draw(cur):null;
  if(cur) qType=pickType(cur);
  shown=false; rated=false; render();
  if(cur) speak();
}

/* ---------- speech ---------- */
function speak(){
  try{
    if(!('speechSynthesis' in window)||!cur) return;
    const u=new SpeechSynthesisUtterance(cur.kana);
    u.lang='ja-JP'; u.rate=.9;
    const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.replace('_','-').startsWith('ja'));
    if(v) u.voice=v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- render card ---------- */
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function render(){
  const card=$('card'), act=$('actions'); card.innerHTML=''; act.innerHTML='';
  if(!cur){
    const d=el('div','empty');
    d.appendChild(el('p',null,'單字庫是空的（或當前條件下沒有單字）。從考古題整理幾個生字加進來，或先載入範例單字試試看。'));
    const b=el('button','btn','載入範例單字'); b.onclick=()=>{
      sampleLoad();
    }; d.appendChild(b); card.appendChild(d); return;
  }
  const tag=el('div','tag',qType==='kanji'?'漢字':'平假名'); card.appendChild(tag);
  const dots=el('span','dots'); for(let i=0;i<5;i++){const x=el('i',i<cur.level?'on':'');dots.appendChild(x);}
  dots.title='熟悉度 '+cur.level+' / 5'; tag.appendChild(dots);
  card.appendChild(el('div','q',qType==='kanji'?cur.kanji:cur.kana));
  if(shown){
    const a=el('div','ans');
    const other=qType==='kanji'?cur.kana:(cur.kanji||'（沒有漢字）');
    a.appendChild(el('div','a1',other));
    a.appendChild(el('div','a2',cur.meaning));

    // 過去回答紀錄
    const history = cur.history || [];
    const hBox = el('div','history-box');
    const hTitle = el('div','history-title');
    hTitle.appendChild(el('span',null,'過去複習紀錄'));
    hTitle.appendChild(el('span',null,'累計次數：' + history.length + ' 次'));
    hBox.appendChild(hTitle);

    if(history.length === 0){
      hBox.appendChild(el('div', null, '這是第一次進行複習測試。'));
    } else {
      const hTags = el('div','history-tags');
      const recent = history.slice(-5);
      recent.forEach(item => {
        let text = '', cls = '';
        if(item.res === 'no'){ text = '✕ 忘了'; cls = 'no'; }
        else if(item.res === 'mid'){ text = '△ 有點印象'; cls = 'mid'; }
        else if(item.res === 'yes'){ text = '◯ 記起來了'; cls = 'yes'; }
        hTags.appendChild(el('span', 'htag ' + cls, text));
      });
      hBox.appendChild(hTags);
    }
    a.appendChild(hBox);

    card.appendChild(a);
  }else{
    card.appendChild(el('div','hint','先試著回想讀音與意思，再查看答案'));
  }
  const row=el('div','row');
  const rep=el('button','btn ghost','🔊 重播發音'); rep.onclick=speak; row.appendChild(rep);
  if(!shown){const s=el('button','btn','查看答案'); s.onclick=()=>{shown=true;render();}; row.appendChild(s);}
  act.appendChild(row);
  if(shown){
    const r=el('div','row rate');
    [['no','忘了','熟悉度 −1',-1],['mid','有點印象','維持不變',0],['yes','記起來了','熟悉度 +1',1]].forEach(([c,t,s,d])=>{
      const b=el('button','btn '+c,t); b.appendChild(el('small',null,s));
      b.onclick=()=>rate(d, c); r.appendChild(b);
    });
    act.appendChild(r);
  }
}
function rate(d, resType){
  if(rated||!cur) return; rated=true;
  cur.level=Math.min(5,Math.max(0,cur.level+d));
  if(!cur.history) cur.history = [];
  cur.history.push({ time: Date.now(), res: resType });
  save(); renderStats(); next();
}

/* ---------- add words ---------- */
function msg(id,t,type){const m=$(id);m.textContent=t;m.className='msg '+(type||'');}
function key(w){return (w.kanji||'')+'|'+w.kana;}
function sampleLoad(){
  const day=daysLeft().n; const keys=new Set(words.map(key));
  SAMPLE.forEach(([k,h,m])=>{
    const w={kanji:k,kana:h,meaning:m,level:0,day,history:[]};
    if(!keys.has(key(w))) words.push(w);
  });
  save(); renderStats(); next();
}
$('addBtn').onclick=()=>{
  const kanji=$('fKanji').value.trim(), kana=$('fKana').value.trim(), meaning=$('fMeaning').value.trim();
  if(!kana||!meaning){msg('addMsg','請填寫平假名與中文意思。','err');return;}
  const w={kanji,kana,meaning,level:0,day:daysLeft().n,history:[]};
  if(words.some(x=>key(x)===key(w))){msg('addMsg','這個單字已經在單字庫裡了。','err');return;}
  words.push(w); save(); renderStats();
  ['fKanji','fKana','fMeaning'].forEach(i=>$(i).value='');
  msg('addMsg','已加入：'+(kanji||kana)+'（'+meaning+'）','ok');
  if(!cur) next();
};

/* ---------- CSV ---------- */
function parseCSV(text){
  text=text.replace(/^\uFEFF/,''); const rows=[]; let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(f);f=''; if(row.some(x=>x.trim()!==''))rows.push(row); row=[]; }
    else f+=c;
  }
  row.push(f); if(row.some(x=>x.trim()!==''))rows.push(row);
  return rows;
}
function esc(s){s=String(s);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
$('exportBtn').onclick=()=>{
  if(!words.length){msg('csvMsg','單字庫是空的，沒有可匯出的資料。','err');return;}
  const lines=['漢字,ひらがな,意味,熟悉度,day'].concat(words.map(w=>[w.kanji,w.kana,w.meaning,w.level,w.day].map(esc).join(',')));
  const blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='vocab.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  msg('csvMsg','已匯出 '+words.length+' 個單字。','ok');
};
$('importBtn').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{importCSV(String(rd.result));}catch(err){msg('csvMsg','讀取失敗：檔案格式不正確。','err');} $('file').value=''; };
  rd.onerror=()=>msg('csvMsg','讀取檔案時發生錯誤。','err');
  rd.readAsText(f,'utf-8');
};
function importCSV(text){
  const rows=parseCSV(text);
  if(rows.length<2){msg('csvMsg','CSV 沒有資料列，請確認第一列是欄位名稱。','err');return;}
  const H=rows[0].map(h=>h.trim().toLowerCase());
  const idx=names=>H.findIndex(h=>names.includes(h));
  const iK=idx(['漢字','kanji']), iH=idx(['ひらがな','平假名','hiragana','kana']),
        iM=idx(['意味','中文意思','meaning']), iL=idx(['熟悉度','level']),
        iD=idx(['day','天數']);
  if(iH<0||iM<0){msg('csvMsg','缺少必要欄位：需要「ひらがな／平假名」與「意味／中文意思」。','err');return;}
  const defaultDay=daysLeft().n, keys=new Set(words.map(key)); let added=0,dup=0; const errs=[];
  rows.slice(1).forEach((r,i)=>{
    const n=i+2, g=j=>j>=0?(r[j]||'').trim():'';
    const dayVal = iD>=0 && g(iD)!=='' ? Number(g(iD)) : defaultDay;
    const w={kanji:g(iK),kana:g(iH),meaning:g(iM),level:0,day:isNaN(dayVal)?defaultDay:dayVal,history:[]};
    if(!w.kana||!w.meaning){errs.push('第 '+n+' 列：平假名或中文意思為空');return;}
    const lv=g(iL);
    if(lv!==''){const v=Number(lv); if(!Number.isInteger(v)||v<0||v>5){errs.push('第 '+n+' 列：熟悉度必須是 0～5 的整數（「'+lv+'」）');return;} w.level=v;}
    if(keys.has(key(w))){dup++;return;}
    keys.add(key(w)); words.push(w); added++;
  });
  save(); renderStats();
  let t='新增 '+added+' 個單字，略過重複 '+dup+' 個'+(errs.length?'，有問題的資料 '+errs.length+' 列未匯入：\n'+errs.slice(0,8).join('\n')+(errs.length>8?'\n…':''):'。');
  msg('csvMsg',t,errs.length&&!added?'err':'ok');
  if(!cur&&words.length) next();
}

/* ---------- events ---------- */
$('modes').onclick=e=>{
  const b=e.target.closest('button'); if(!b||b.dataset.m===mode) return;
  mode=b.dataset.m;
  document.querySelectorAll('#modes button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.m===mode));
  next();
};
$('examDate').onchange=e=>{
  examStr=e.target.value; try{localStorage.setItem(EK,examStr);}catch(err){} renderCount();
};
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=()=>{};

load(); renderCount(); renderStats(); next();
})();
</script>
</body>
</html>
